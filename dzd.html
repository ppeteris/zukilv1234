<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaidot dzimšanas dienu</title>
</head>
<body>
    <h1>Gaidot dzimšanas dienu..</h1>
    <hr>
    <form>
        <p>Ievadi pilnu datumu, kad Tev būs tuvākā dzimšanas diena:</p>
        <label for="gads">Gads:</label>
        <input type="text" id="gads" name="gads"><br><br>
        <label for="menesis">Mēnesis:</label>
        <input type="text" id="menesis" name="menesis"><br><br>
        <label for="datums">Diena:</label>
        <input type="text" id="datums" name="datums"><br><br>
        <button type="button" id="poga" onclick="dienas()">Aprēķināt dienu skaitu līdz dzimšanas dienai</button>
    </form>
    <p>Līdz svētkiem atlikušas <input type="text" id="dienas" name="dienas"> dienas : ))</p>

    <script>
        function dienas() {
            const gads = document.getElementById("gads").value;
            const menesis = document.getElementById("menesis").value - 1; 
            const datums = document.getElementById("datums").value;

            const birthday = new Date(gads, menesis, datums);
            const today = new Date();

            birthday.setFullYear(today.getFullYear());
            if (today > birthday) {
                birthday.setFullYear(today.getFullYear() + 1);
            }

            const difference = birthday - today;
            const daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));

            document.getElementById("dienas").value = daysLeft;
        }
    </script>
</body>
</html>
