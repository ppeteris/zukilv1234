<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaidot dzimšanas dienu</title>
</head>
<body>
    <!-- Virsraksts -->
    <h1>Gaidot dzimšanas dienu..</h1>

    <!-- Horizontālā līnija -->
    <hr>

    <!-- Forma -->
    <form action="/submit" method="post">
        <!-- Teksts par datuma ievadi -->
        <p>Ievadi pilnu datumu, kad Tev būs tuvākā dzimšanas diena:</p>
        
        <!-- Teksts un lauks "gads" -->
        <label for="gads">Gads:</label>
        <input type="text" id="gads" name="gads" required>
        <br><br>

        <!-- Teksts un lauks "mēnesis" -->
        <label for="menesis">Mēnesis:</label>
        <input type="text" id="menesis" name="menesis" required>
        <br><br>

        <!-- Teksts un lauks "diena" -->
        <label for="datums">Diena:</label>
        <input type="text" id="datums" name="datums" required>
        <br><br>

        <!-- Pogas ievade -->
        <button type="button" id="poga" name="poga" value="Aprēķināt dienu skaitu līdz dzimšanas dienai" onclick="dienas();">
            Aprēķināt dienu skaitu līdz dzimšanas dienai
        </button>
        <br><br>

        <!-- Rezultāta ievade -->
        <p>Līdz svētkiem atlikušas</p>
        <input type="text" id="dienas" name="dienas" readonly>
        <p>dienas : ))</p>
    </form>

    <!-- JavaScript funkcija -->
    <script>
        function dienas() {
            // Iegūt ievades vērtības
            let gads = document.getElementById('gads').value;
            let menesis = document.getElementById('menesis').value - 1; // Mēnesis JavaScript sākas no 0
            let diena = document.getElementById('datums').value;

            // Izveidot ievadītās dzimšanas dienas datumu
            let dzimsanasDiena = new Date(gads, menesis, diena);

            // Šodienas datums
            let sodien = new Date();

            // Pārbaudīt, vai dzimšanas diena ir šogad vai nākamgad
            if (dzimsanasDiena < sodien) {
                dzimsanasDiena.setFullYear(sodien.getFullYear() + 1);
            }

            // Aprēķināt atlikušās dienas
            let atlikusasDienas = Math.ceil((dzimsanasDiena - sodien) / (1000 * 60 * 60 * 24));

            // Ievietot rezultātu
            document.getElementById('dienas').value = atlikusasDienas;
        }
    </script>
</body>
</html>
